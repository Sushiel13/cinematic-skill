name: Render film

# Renders cinematic films to MP4 on GitHub's free runners. No API keys.
#  - Run it by hand: Actions -> Render film -> Run workflow (pick a film; set "preview" to render a draft).
#  - Or push a project to films/<name>/ on main: every changed film renders automatically.
# A film's own settings live in films/<name>/film.env; anything you fill in when running by hand wins.
# Each film is uploaded as a workflow artifact and published as a GitHub Release with download links.

on:
  workflow_dispatch:
    inputs:
      film:
        description: 'Film: "example" (Wright brothers), "starter", or a folder name in films/'
        required: true
        default: example
      preview:
        description: 'Preview: render only the first N seconds (e.g. 30). Empty = the full film'
        default: ''
      size:
        description: Video size (empty = the film's own setting, else 1920x1080)
        type: choice
        options: ['', 1920x1080, 1280x720, 1080x1920, 3840x2160]
        default: ''
      captions:
        description: Burned-in caption style; an SRT is always made too (empty = the film's own setting)
        type: choice
        options: ['', highlighter, clean, paper, redbar, none]
        default: ''
      voice:
        description: Narration voice (empty = the film's own setting, else piper)
        type: choice
        options: ['', piper, espeak]
        default: ''
      piper_voice:
        description: Piper voice, e.g. en_US-ryan-high or hi_IN-pratham-medium (empty = the film's own setting)
        default: ''
      target:
        description: Optional film length in seconds (leave empty for the natural read)
        default: ''
  push:
    branches: [main]
    paths: ['films/**']

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      films: ${{ steps.pick.outputs.films }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          INPUT_FILM: ${{ inputs.film }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            films="[\"$INPUT_FILM\"]"
          else
            base="$BEFORE"
            git cat-file -e "$base" 2>/dev/null || base="HEAD~1"
            films=$(git diff --name-only "$base" HEAD -- films/ \
              | awk -F/ 'NF>2 {print $2}' | sort -u \
              | while read -r f; do [ -f "films/$f/script.json" ] && echo "$f"; done \
              | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          fi
          echo "Films to render: $films"
          echo "films=$films" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    if: needs.plan.outputs.films != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        film: ${{ fromJSON(needs.plan.outputs.films) }}
    env:
      INPUT_PREVIEW: ${{ inputs.preview }}
      INPUT_SIZE: ${{ inputs.size }}
      INPUT_CAPTIONS: ${{ inputs.captions }}
      INPUT_VOICE: ${{ inputs.voice }}
      INPUT_PIPER_VOICE: ${{ inputs.piper_voice }}
      INPUT_TARGET: ${{ inputs.target }}
      KIND: ${{ inputs.preview && 'preview' || 'film' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ffmpeg, espeak-ng, fonts and Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core fonts-noto-core libgl1 libegl1 libfontconfig1
          pip install -q -r requirements.txt piper-tts

      - name: Cache Piper voices
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/piper-voices
          key: piper-voices-v1

      - name: Setup check
        run: python skills/cinematic-film/scripts/check_setup.py

      - name: Render ${{ matrix.film }}
        env:
          FILM: ${{ matrix.film }}
        run: bash .github/scripts/render-film.sh "$FILM" "$RUNNER_TEMP/release"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KIND }}-${{ matrix.film }}
          path: ${{ runner.temp }}/release

      - name: Publish release (download links)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.KIND }}-${{ matrix.film }}-${{ github.run_number }}
          name: ${{ matrix.film }} ${{ env.KIND }} (run ${{ github.run_number }})
          prerelease: ${{ env.KIND == 'preview' }}
          body: |
            Rendered by the **Render film** workflow (${{ env.KIND }}${{ inputs.preview && format(', first {0} seconds', inputs.preview) || '' }}).

            - `*.mp4`: clean film (upload to YouTube with the .srt)
            - `*-captions.mp4`: captions burned in (Shorts, Instagram, WhatsApp)
            - `*.srt`: subtitles
            - `*-voiceover.m4a`: the narration on its own
            - `*-thumbnail.png`: thumbnail (when the film sets one)
            - `*-credits.md`, `*-CREDITS.md`: image, audio and font credits and licences
          files: ${{ runner.temp }}/release/*
